spring:
  application:
    name: spring-ai-rag
  threads:
    virtual:
      enabled: true
  mvc:
    async:
      request-timeout: 600000  # 设置为 60 秒，确保比业务代码的 30s 长
  ai:
    ollama:
      # 远程 Ollama 地址
      base-url: http://8.140.221.150:11434
      chat:
        model: qwen2.5:1.5b
        options:
          temperature: 0.3      # 严谨模式，适合政策解读
          top-p: 0.9           # 保持回答的连贯性
          # num-predict: 512   # 限制输出长度，节省内存/响应时间
      embedding:
        model: bge-m3          # 维度必须是 1024
    vectorstore:
      milvus:
        client:
          host: 8.140.221.150
          port: 19530
        # 即使你在 Java 代码里写死了，这里保留配置也是好习惯
        collection-name: policy_docs
        embedding-dimension: 1024
        # database-name: default
    openai:
      api-key: sk-41ff1d3510d540179bd99fde2160502c  # 👈 从环境变量 OPENAI_API_KEY 读取
      base-url: https://api.deepseek.com  # 👈 关键！必须添加
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
    # =============================================================
    # MCP Server 配置：把 @Tool 工具发布为 MCP 工具
    # 协议可选：STATELESS（无状态，推荐）/ STREAMABLE / SSE
    # 客户端接入：MCP Streamable HTTP 客户端连接 http://<host>:8081/mcp
    # =============================================================
    mcp:
      server:
        enabled: true
        protocol: STATELESS
        name: spring-ai-rag-mcp
        version: 1.0.0
        type: SYNC
        capabilities:
          tool: true        # 发布工具（getWeather / searchKnowledgeBase）
          resource: false   # 不发布资源
          prompt: false     # 不发布提示词
        streamable-http:
          mcp-endpoint: /mcp  # 无状态/流式 HTTP 传输端点（1.1.x 属性前缀）
  servlet:
    multipart:
      # 单个文件的最大限制 (根据你的需求调整，例如 50MB)
      max-file-size: 50MB
      # 单个请求的总限制 (包含表单其他参数，建议比上面略大)
      max-request-size: 60MB

spring.datasource.hikari.maximum-pool-size: 5
spring.datasource.hikari.minimum-idle: 2

server:
  port: 8081
  # 增加 Servlet 超时时间，防止大模型生成太慢导致连接断开
  tomcat:
    connection-timeout: 60s

logging:
  file:
    name: logs/rag-system.log
  level:
    # 1. 业务逻辑日志
    com.wx.policyragsystem: info
    # 2. Spring AI 核心日志（监控 Prompt 拼接）
    org.springframework.ai: info
    # 3. Milvus 交互日志（监控集合创建和检索过程）
    io.milvus: info
    # 4. 远程调用日志
    org.springframework.web.client.RestTemplate: info
    # 彻底关闭一些无关紧要的框架警告，保持控制台整洁
    org.apache.catalina: info
    org.apache.tomcat: info
    org.apache.tika.parser.external.ExternalParser: info
amap.api.key: ${AMAP_API_KEY}